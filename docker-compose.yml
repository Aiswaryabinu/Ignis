services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
      POSTGRES_DB: brightloop
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop"]
      interval: 5s
      retries: 10
    ports: ["5435:5432"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://brightloop:brightloop@db:5432/brightloop
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-at-least-32-bytes}
      ENABLE_SCHEDULER: "true"
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

volumes:
  pgdata:
